[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-bench"
version = "1.6.0"
description = "Test each claim in a thesis against a measurement and get MATCH, DRIFT or UNVERIFIABLE, with a sealed record anyone can recheck."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zain Dana Harper", email = "zaindharper@gmail.com" }]
keywords = [
    "reasoning", "judgment", "verification", "accountability", "theses", "steelman",
    "refine", "verdict", "epistemics", "falsification", "research", "evidence",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1", "twine>=6"]

[project.scripts]
crucible = "crucible.cli:main"

[project.urls]
Homepage = "https://harperz9.github.io/crucible.html"
Repository = "https://github.com/HarperZ9/crucible"
Issues = "https://github.com/HarperZ9/crucible/issues"
Changelog = "https://github.com/HarperZ9/crucible/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crucible.examples" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/crucible"]
