name: Release

# Publishes crucible-bench to PyPI through trusted publishing (OIDC); no token is stored anywhere.
# Runs when a GitHub Release is published for a v* tag. Every action is pinned by commit.
#
# Three jobs, each with the least access it needs:
#   build           checks the tag and version sites, builds, runs twine check and the wheel smoke.
#                   Read-only; it can never mint a publishing token.
#   publish         downloads the checked files and uploads them. The only job with id-token.
#   github-release  downloads the published files from PyPI, checks them against PyPI's digests
#                   and this run's build, and attaches them with SHA256SUMS.txt to the Release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build and check distributions
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check the tag and every version site
        run: python scripts/check_version_sites.py . --tag "$GITHUB_REF_NAME"
      - name: Install build tools
        run: python -m pip install --requirement requirements-release.txt
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Smoke-test the wheel in a fresh environment
        run: python scripts/smoke_wheel.py dist/*.whl
      - name: Record artifact digests
        id: digests
        run: |
          sha256sum dist/* | sed 's#dist/##' | tee digests.txt
          echo "digests=$(paste -sd';' digests.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, native-client]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: pypi
      url: https://pypi.org/project/crucible-bench/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          # A re-run after a partial upload must not fail on files PyPI already holds.
          skip-existing: true

  github-release:
    name: Attach PyPI files and SHA256SUMS.txt to the GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILT_DIGESTS: ${{ needs.build.outputs.digests }}
    steps:
      - name: Download the published files from PyPI and check their digests
        run: |
          python - <<'PYEOF'
          import hashlib, json, os, pathlib, time, urllib.request

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          first_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1") == "1"
          url = f"https://pypi.org/pypi/crucible-bench/{version}/json"
          headers = {"User-Agent": "crucible-release-workflow"}
          expected = {f"crucible_bench-{version}-py3-none-any.whl", f"crucible_bench-{version}.tar.gz"}
          files = []
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
                      files = json.load(r)["urls"]
              except OSError as exc:
                  print(f"PyPI not ready ({exc}); retrying")
              if {f["filename"] for f in files} >= expected:
                  break
              time.sleep(15)
          else:
              raise SystemExit(f"PyPI never listed {sorted(expected)}")
          built = dict(line.split("  ")[::-1] for line in os.environ["BUILT_DIGESTS"].split(";") if line)
          out = pathlib.Path("release-assets")
          out.mkdir()
          sums = []
          for f in sorted((f for f in files if f["filename"] in expected), key=lambda f: f["filename"]):
              req = urllib.request.Request(f["url"], headers=headers)
              data = urllib.request.urlopen(req).read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != f["digests"]["sha256"]:
                  raise SystemExit(f"{f['filename']}: downloaded bytes do not match PyPI's digest")
              if built.get(f["filename"]) != digest:
                  note = f"{f['filename']} on PyPI differs from this run's build"
                  if first_attempt:
                      raise SystemExit(f"{note}; PyPI must serve what this run uploaded")
                  print(f"::warning::{note}; on a re-run PyPI keeps the first upload, which users install")
              (out / f["filename"]).write_bytes(data)
              sums.append(f"{digest}  {f['filename']}\n")
          (out / "SHA256SUMS.txt").write_bytes("".join(sums).encode("ascii"))
          print("".join(sums), end="")
          PYEOF
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
  native-client:
    name: Qualify and bundle local Windows client tools
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install native build and test tools
        run: python -m pip install pyinstaller==6.21.0 pytest==8.4.2
      - name: Exercise local client boundaries
        run: python -m pytest tests/test_client_profile.py tests/test_client_package.py tests/test_client_process.py -q
      - name: Build native client and verify actual stdio
        shell: pwsh
        run: |
          $mode = if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { 'release' } else { 'dev' }
          python scripts/build_client_package.py "$env:RUNNER_TEMP/client-package" --mode $mode --native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-client-assets
          path: ${{ runner.temp }}/client-package/artifacts/
          if-no-files-found: error

  attach-client:
    name: Attach checked client packages to the same product release
    needs: [github-release, native-client]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: local-client-assets
          path: client-assets/
      - name: Verify checksums and attach without replacing published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd client-assets && sha256sum -c CLIENT-SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" client-assets/*
